name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the older run. On main, every run
# gets its own group, so the checks never wait; only the plan and apply jobs
# take turns (group "terraform" below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Only the plan and apply jobs, on main, may ask GitHub
# for the token that AWS swaps for credentials.
permissions:
  contents: read

# Runners and tools are pinned, not "latest", so an upgrade is a commit here
# rather than a surprise.
env:
  TERRAFORM_VERSION: "1.17.1"
  CHECKOV_VERSION: "3.4.0"
  UV_VERSION: "0.12.24"
  GITLEAKS_VERSION: "8.23.3"

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install from the lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      # Models, tests and configs, checked without a warehouse. They run
      # against Athena in `make dbt-build`.
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
        env:
          ENERGY_LAKE_BUCKET: not-used

  image:
    name: Images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The same builds scripts/image.sh runs, without the push.
      - name: Build the ingest image
        run: docker build --platform linux/amd64 --provenance=false --target ingest --tag energy-ingest:ci .

      - name: Build the transform image
        run: docker build --platform linux/amd64 --provenance=false --target transform --tag energy-transform:ci .

      - name: The ingest image has its handlers and no dbt
        run: |
          docker run --rm --entrypoint python3 energy-ingest:ci -c "
          import importlib.util, energy.handlers
          assert importlib.util.find_spec('dbt') is None, 'dbt does not belong in the ingest image'
          print('ingest image ok')"

      # Read-only with a writable /tmp, as in Lambda: if dbt tried to write
      # anywhere else, this would fail here instead of in the first scheduled run.
      - name: The transform image parses the dbt project read-only
        run: |
          docker run --rm --read-only --tmpfs /tmp -e ENERGY_LAKE_BUCKET=not-used \
            --entrypoint python3 energy-transform:ci -c "
          from dbt.cli.main import dbtRunner
          from energy.config import Settings
          from energy.transform import dbt_args, use_thread_locks
          use_thread_locks()
          result = dbtRunner().invoke(dbt_args('parse', Settings()))
          assert result.success, result.exception
          print('transform image ok')"

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff infra

      # -backend=false: providers only, no state, no AWS credentials.
      - name: Validate the bootstrap stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate the main stack
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  scan:
    name: Security checks (checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: checkov
        run: uvx --from "checkov==${CHECKOV_VERSION}" checkov --config-file .checkov.yaml

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scripts/*.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: a secret deleted later is still leaked

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git . --redact --verbose --no-banner

  # After every check has passed on main: push the images ECR doesn't have
  # yet, and show what `terraform apply` would change. The role it assumes,
  # github-energy-plan (infra/bootstrap/ci.tf), can read the main stack but
  # not change it. The repository is public, and so are these logs: the
  # account ID and the alert email are secrets, which GitHub masks.
  #
  # Plan and apply share a concurrency group and never cancel each other: a
  # job stopped halfway could leave the state locked. While an apply waits for
  # my approval, the next run's plan waits too (its plan would be out of date
  # after the apply anyway). Rejecting the apply lets it go on.
  plan:
    name: Push images, plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python, image, terraform, scan, shell, secrets]
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    permissions:
      contents: read
      id-token: write # the OIDC token AWS checks; no stored key
    env:
      AWS_REGION: eu-central-1
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    defaults:
      run:
        shell: bash # -eo pipefail, so a failed plan isn't hidden by tee
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials for an hour, from GitHub's token
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-energy-plan
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Tagged by content: a commit that doesn't change the images pushes
      # nothing, and one that does is pushed before the plan needs it.
      - name: Push the images ECR doesn't have
        run: scripts/image.sh push

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=energy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        id: plan
        run: scripts/ci_plan.sh

  # Only when the plan changes something, and only after I approve it: the
  # environment `production` requires my review, and github-energy-apply
  # trusts no other job. It plans again (see scripts/ci_plan.sh for why) and
  # stops unless that plan changes the same resources in the same ways.
  apply:
    name: Apply (after my approval)
    if: needs.plan.outputs.changes == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: terraform
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # the OIDC token AWS checks; no stored key
    env:
      AWS_REGION: eu-central-1
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials for an hour, from GitHub's token
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-energy-apply
          role-session-name: apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=energy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform plan, again
        id: plan
        run: scripts/ci_plan.sh

      - name: Stop unless this is the plan I approved
        if: steps.plan.outputs.fingerprint != needs.plan.outputs.fingerprint
        run: |
          echo "::error::This plan changes other resources than the approved one. Nothing was applied: run the workflow again."
          exit 1

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -no-color -lock-timeout=5m tfplan

[project]
name = "energy-data-aws"
version = "0.1.0"
description = "European day-ahead electricity prices from ENTSO-E, serverless on AWS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "defusedxml>=0.7",
    "httpx>=0.28,<1",
    "pyarrow>=20",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.4",
    "tenacity>=9.1",
]

[dependency-groups]
dev = [
    # S3 and SSM in memory: the handlers run against them in the tests.
    "moto[s3,ssm]>=5.1",
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=8.4",
    "pytest-cov>=7",
    "respx>=0.23",
    "ruff>=0.13",
    "types-boto3[s3,ssm]>=1.40",
    "types-defusedxml>=0.7",
]

[tool.uv]
# CI and the Dockerfile pin uv 0.12.24; the lockfile reads with 0.11.32 and up.
required-version = ">=0.11.32"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy"]


# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "PTH", "RUF"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# PyArrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=energy --cov-report=term-missing --cov-branch"
markers = [
    "integration: calls the real ENTSO-E API with a token from the environment",
]
